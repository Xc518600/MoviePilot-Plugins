name: Release DiskSpaceAutoCleaner

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 3.9.23'
        required: true
        default: '3.9.23'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          PLUGIN_DIR="plugins.v2/diskspaceautocleaner"
          ZIP_NAME="diskspaceautocleaner_v${VERSION}.zip"
          tmpdir="/tmp/diskspaceautocleaner-release"
          rm -rf "$tmpdir"
          mkdir -p "$tmpdir/diskspaceautocleaner"
          cp -a "$PLUGIN_DIR/." "$tmpdir/diskspaceautocleaner/"
          (cd "$tmpdir" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" diskspaceautocleaner >/dev/null)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diskspaceautocleaner_v${{ inputs.version }}
          name: diskspaceautocleaner v${{ inputs.version }}
          files: diskspaceautocleaner_v${{ inputs.version }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true

